name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: gofmt -l . | (! grep -q .) || (echo "Unformatted files" && exit 1)
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
