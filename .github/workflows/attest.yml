name: build-attest-provenance

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup just
        uses: extractions/setup-just@v4

      - name: Build artifact
        run: just build
      - name: Attest
        uses: actions/attest@v4
        with:
          subject-path: '${{ github.workspace }}/build/smbark'
